name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Full tournament matrices are too slow for every push — they run nightly.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  # Cached shared participant pool; bump the suffix to force a reseed.
  PARTICIPANT_POOL_CACHE_KEY: participant-pool-v1

jobs:
  static:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 20
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      ORGANIZER_EMAIL: ${{ secrets.ORGANIZER_EMAIL }}
      ORGANIZER_PASSWORD: ${{ secrets.ORGANIZER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # API tests need no browser, so skip Chromium download here.
      - run: npm ci --ignore-scripts
      # The pool-setup dependency seeds through the UI, so a browser is still needed.
      - run: npm run browsers
      - uses: actions/cache@v4
        with:
          path: .cache/participant-pool.json
          key: ${{ env.PARTICIPANT_POOL_CACHE_KEY }}
      - run: npm run test:api

  ui-tests:
    name: UI tests
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 45
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      ORGANIZER_EMAIL: ${{ secrets.ORGANIZER_EMAIL }}
      ORGANIZER_PASSWORD: ${{ secrets.ORGANIZER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run browsers
      - uses: actions/cache@v4
        with:
          path: .cache/participant-pool.json
          key: ${{ env.PARTICIPANT_POOL_CACHE_KEY }}
      - run: npm run test:ui:fast

  scenario-tests:
    name: Tournament scenario matrices
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 90
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      ORGANIZER_EMAIL: ${{ secrets.ORGANIZER_EMAIL }}
      ORGANIZER_PASSWORD: ${{ secrets.ORGANIZER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run browsers
      - uses: actions/cache@v4
        with:
          path: .cache/participant-pool.json
          key: ${{ env.PARTICIPANT_POOL_CACHE_KEY }}
      - run: npm run test:scenarios
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7
